name: Build and publish JuiceFS SDK wheels and CLI

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: GitHub release tag
        required: true
        type: string
      package_version:
        description: Python package version
        required: true
        type: string

permissions:
  contents: write

env:
  GO_VERSION: 1.21.13
  PACKAGE_VERSION: ${{ inputs.package_version }}
  RELEASE_TAG: ${{ inputs.release_tag }}

jobs:
  preflight:
    name: Require master and a new release tag
    runs-on: ubuntu-24.04
    steps:
      - name: Fail when the dispatch ref is not master
        run: |
          if [ "${GITHUB_REF}" != "refs/heads/master" ]; then
            echo "::error::Dispatch this workflow from master. The selected ref is ${GITHUB_REF}."
            exit 1
          fi

      - name: Fail when the release tag already exists
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
        run: |
          existing="$(gh api "repos/${GITHUB_REPOSITORY}/git/matching-refs/tags/${RELEASE_TAG}" --jq "[.[] | select(.ref == \"refs/tags/${RELEASE_TAG}\")] | length")"
          if [ "${existing}" != "0" ]; then
            echo "::error::Tag ${RELEASE_TAG} already exists. Published release assets must not change, so dispatch with a new release_tag and package_version."
            exit 1
          fi

  build:
    name: Build ${{ matrix.name }}
    needs: preflight
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: manylinux2014_x86_64
            runner: ubuntu-24.04
            build_image: quay.io/pypa/manylinux2014_x86_64:2026.09.23-1@sha256:2fa5f99f660f115f547d96b4edcadfc19f77a6de8807734bf0fc4924f81be01a
            go_arch: amd64
            platform_tag: manylinux2014_x86_64
            host_python_command: python3
          - name: manylinux2014_aarch64
            runner: ubuntu-24.04-arm
            build_image: quay.io/pypa/manylinux2014_aarch64:2026.09.23-1@sha256:47940daeb8e0fdcc7deefad334bfda3d8d12b447ba1ebd5411f9f106318eafdb
            go_arch: arm64
            platform_tag: manylinux2014_aarch64
            host_python_command: python3
          - name: macosx_11_0_arm64
            runner: macos-14
            build_image: ""
            go_arch: ""
            platform_tag: macosx_11_0_arm64
            host_python_command: python

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set reproducible build timestamp
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "${GITHUB_ENV}"

      - name: Set up Go
        if: runner.os == 'macOS'
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: Set up Python
        if: runner.os == 'macOS'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set package version
        env:
          PACKAGE_VERSION: ${{ env.PACKAGE_VERSION }}
          PYTHON_COMMAND: ${{ matrix.host_python_command }}
        run: |
          "${PYTHON_COMMAND}" - "${PACKAGE_VERSION}" <<'PY'
          import sys
          from pathlib import Path

          path = Path("sdk/python/juicefs/setup.py")
          contents = path.read_text()
          old = 'VERSION = "1.4.1"'
          new = f'VERSION = "{sys.argv[1]}"'
          if contents.count(old) != 1:
              raise SystemExit("setup.py does not contain the pinned 1.4.1 version")
          path.write_text(contents.replace(old, new, 1))
          PY

      - name: Install macOS build tools
        if: runner.os == 'macOS'
        env:
          PYTHON_COMMAND: ${{ matrix.host_python_command }}
        run: |
          "${PYTHON_COMMAND}" -m pip install --upgrade build wheel

      - name: Build Linux wheel and CLI tarball
        if: runner.os == 'Linux'
        env:
          BUILD_IMAGE: ${{ matrix.build_image }}
          GO_ARCH: ${{ matrix.go_arch }}
          PACKAGE_VERSION: ${{ env.PACKAGE_VERSION }}
          PLATFORM_TAG: ${{ matrix.platform_tag }}
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          REVISION_DATE="$(date -u +%Y-%m-%d)"
          export REVISION_DATE
          docker run --rm             --volume "${GITHUB_WORKSPACE}:/workspace"             --workdir /workspace             --env GO_ARCH             --env GO_VERSION             --env PACKAGE_VERSION             --env PLATFORM_TAG             --env RELEASE_TAG             --env GITHUB_SHA             --env REVISION_DATE             --env SOURCE_DATE_EPOCH             "${BUILD_IMAGE}"             bash -euo pipefail -c '
              yum install -y gcc git make curl
              curl -fsSL "https://go.dev/dl/go${GO_VERSION}.linux-${GO_ARCH}.tar.gz" -o /tmp/go.tar.gz
              tar -C /usr/local -xzf /tmp/go.tar.gz
              export PATH="/usr/local/go/bin:${PATH}"
              export CGO_ENABLED=1
              PYTHON_COMMAND="/opt/python/cp39-cp39/bin/python"
              "${PYTHON_COMMAND}" -m pip install --upgrade build wheel
              LDFLAGS="-s -w"
              go build -buildmode c-shared -buildvcs=false -ldflags="${LDFLAGS}" -o sdk/python/juicefs/juicefs/libjfs.so ./sdk/java/libjfs
              rm -rf dist
              "${PYTHON_COMMAND}" -m build --wheel --outdir dist sdk/python/juicefs
              "${PYTHON_COMMAND}" -m wheel tags --remove --platform-tag "${PLATFORM_TAG}" "dist/juicefs-${PACKAGE_VERSION}-py3-none-any.whl"
              test -f "dist/juicefs-${PACKAGE_VERSION}-py3-none-${PLATFORM_TAG}.whl"
              VERSION_PKG="github.com/juicedata/juicefs/pkg/version"
              CLI_LDFLAGS="${LDFLAGS} -X ${VERSION_PKG}.revision=${GITHUB_SHA:0:7} -X ${VERSION_PKG}.revisionDate=${REVISION_DATE}"
              go build -buildvcs=false -ldflags="${CLI_LDFLAGS}" -o dist/juicefs .
              dist/juicefs --version | grep -q "${GITHUB_SHA:0:7}"
              tar -czf "dist/${RELEASE_TAG}-linux-${GO_ARCH}.tar.gz" -C dist juicefs
              rm dist/juicefs
            '

      - name: Build macOS wheel
        if: runner.os == 'macOS'
        env:
          PACKAGE_VERSION: ${{ env.PACKAGE_VERSION }}
          PLATFORM_TAG: ${{ matrix.platform_tag }}
          PYTHON_COMMAND: ${{ matrix.host_python_command }}
        run: |
          export CGO_ENABLED=1
          go build -buildmode c-shared -buildvcs=false -ldflags="-s -w" -o sdk/python/juicefs/juicefs/libjfs.dylib ./sdk/java/libjfs
          rm -rf dist
          "${PYTHON_COMMAND}" -m build --wheel --outdir dist sdk/python/juicefs
          "${PYTHON_COMMAND}" -m wheel tags --remove --platform-tag "${PLATFORM_TAG}" "dist/juicefs-${PACKAGE_VERSION}-py3-none-any.whl"
          test -f "dist/juicefs-${PACKAGE_VERSION}-py3-none-${PLATFORM_TAG}.whl"

      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.name }}
          path: dist/*.whl
          if-no-files-found: error

      - name: Upload CLI tarball
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.name }}
          path: dist/*.tar.gz
          if-no-files-found: error

  publish:
    name: Publish release assets
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: "{wheel-*,cli-*}"
          path: dist
          merge-multiple: true

      - name: Validate artifact set
        env:
          PACKAGE_VERSION: ${{ env.PACKAGE_VERSION }}
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
        run: |
          for platform in manylinux2014_x86_64 manylinux2014_aarch64 macosx_11_0_arm64; do
            test -f "dist/juicefs-${PACKAGE_VERSION}-py3-none-${platform}.whl"
          done
          test "$(find dist -maxdepth 1 -type f -name '*.whl' | wc -l)" -eq 3
          for arch in amd64 arm64; do
            test -f "dist/${RELEASE_TAG}-linux-${arch}.tar.gz"
          done
          test "$(find dist -maxdepth 1 -type f -name '*.tar.gz' | wc -l)" -eq 2

      - name: Record artifact checksums
        run: |
          cd dist
          sha256sum *.whl *.tar.gz | tee checksums.txt

      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE_VERSION: ${{ env.PACKAGE_VERSION }}
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
        run: |
          gh release create "${RELEASE_TAG}" dist/*.whl dist/*.tar.gz dist/checksums.txt \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${GITHUB_SHA}" \
            --title "JuiceFS ${PACKAGE_VERSION}" \
            --notes "Python SDK wheels and Linux CLI binaries for ${PACKAGE_VERSION}."

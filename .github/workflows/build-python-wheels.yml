name: Build and publish Python SDK wheels

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: GitHub release tag
        required: true
        default: juicefs-1.4.1-unc1
        type: string
      package_version:
        description: Python package version
        required: true
        default: 1.4.1+unc1
        type: string

permissions:
  contents: write

env:
  GO_VERSION: 1.21.13
  PACKAGE_VERSION: ${{ inputs.package_version }}
  RELEASE_TAG: ${{ inputs.release_tag }}

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: manylinux2014_x86_64
            runner: ubuntu-24.04
            build_image: quay.io/pypa/manylinux2014_x86_64
            go_arch: amd64
            platform_tag: manylinux2014_x86_64
            host_python_command: python3
          - name: manylinux2014_aarch64
            runner: ubuntu-24.04-arm
            build_image: quay.io/pypa/manylinux2014_aarch64
            go_arch: arm64
            platform_tag: manylinux2014_aarch64
            host_python_command: python3
          - name: macosx_11_0_arm64
            runner: macos-14
            build_image: ""
            go_arch: ""
            platform_tag: macosx_11_0_arm64
            host_python_command: python

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: master

      - name: Set up Go
        if: runner.os == 'macOS'
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: Set up Python
        if: runner.os == 'macOS'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set package version
        env:
          PACKAGE_VERSION: ${{ env.PACKAGE_VERSION }}
          PYTHON_COMMAND: ${{ matrix.host_python_command }}
        run: |
          "${PYTHON_COMMAND}" - "${PACKAGE_VERSION}" <<'PY'
          import sys
          from pathlib import Path

          path = Path("sdk/python/juicefs/setup.py")
          contents = path.read_text()
          old = 'VERSION = "1.4.1"'
          new = f'VERSION = "{sys.argv[1]}"'
          if contents.count(old) != 1:
              raise SystemExit("setup.py does not contain the pinned 1.4.1 version")
          path.write_text(contents.replace(old, new, 1))
          PY

      - name: Install macOS build tools
        if: runner.os == 'macOS'
        env:
          PYTHON_COMMAND: ${{ matrix.host_python_command }}
        run: |
          "${PYTHON_COMMAND}" -m pip install --upgrade build wheel

      - name: Build Linux wheel
        if: runner.os == 'Linux'
        env:
          BUILD_IMAGE: ${{ matrix.build_image }}
          GO_ARCH: ${{ matrix.go_arch }}
          PACKAGE_VERSION: ${{ env.PACKAGE_VERSION }}
          PLATFORM_TAG: ${{ matrix.platform_tag }}
        run: |
          docker run --rm             --volume "${GITHUB_WORKSPACE}:/workspace"             --workdir /workspace             --env GO_ARCH             --env GO_VERSION             --env PACKAGE_VERSION             --env PLATFORM_TAG             "${BUILD_IMAGE}"             bash -euo pipefail -c '
              yum install -y gcc git make curl
              curl -fsSL "https://go.dev/dl/go${GO_VERSION}.linux-${GO_ARCH}.tar.gz" -o /tmp/go.tar.gz
              tar -C /usr/local -xzf /tmp/go.tar.gz
              export PATH="/usr/local/go/bin:${PATH}"
              export CGO_ENABLED=1
              PYTHON_COMMAND="/opt/python/cp39-cp39/bin/python"
              "${PYTHON_COMMAND}" -m pip install --upgrade build wheel
              make -C sdk/python libjfs
              rm -rf dist
              "${PYTHON_COMMAND}" -m build --wheel --outdir dist sdk/python/juicefs
              "${PYTHON_COMMAND}" -m wheel tags --remove --platform-tag "${PLATFORM_TAG}" "dist/juicefs-${PACKAGE_VERSION}-py3-none-any.whl"
              test -f "dist/juicefs-${PACKAGE_VERSION}-py3-none-${PLATFORM_TAG}.whl"
            '

      - name: Build macOS wheel
        if: runner.os == 'macOS'
        env:
          PACKAGE_VERSION: ${{ env.PACKAGE_VERSION }}
          PLATFORM_TAG: ${{ matrix.platform_tag }}
          PYTHON_COMMAND: ${{ matrix.host_python_command }}
        run: |
          export CGO_ENABLED=1
          make -C sdk/python libjfs
          rm -rf dist
          "${PYTHON_COMMAND}" -m build --wheel --outdir dist sdk/python/juicefs
          "${PYTHON_COMMAND}" -m wheel tags --remove --platform-tag "${PLATFORM_TAG}" "dist/juicefs-${PACKAGE_VERSION}-py3-none-any.whl"
          test -f "dist/juicefs-${PACKAGE_VERSION}-py3-none-${PLATFORM_TAG}.whl"

      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.name }}
          path: dist/*.whl
          if-no-files-found: error

  publish:
    name: Publish release assets
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - name: Download wheels
        uses: actions/download-artifact@v4
        with:
          pattern: wheel-*
          path: dist
          merge-multiple: true

      - name: Validate wheel set
        env:
          PACKAGE_VERSION: ${{ env.PACKAGE_VERSION }}
        run: |
          for platform in manylinux2014_x86_64 manylinux2014_aarch64 macosx_11_0_arm64; do
            test -f "dist/juicefs-${PACKAGE_VERSION}-py3-none-${platform}.whl"
          done
          test "$(find dist -maxdepth 1 -type f -name '*.whl' | wc -l)" -eq 3

      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE_VERSION: ${{ env.PACKAGE_VERSION }}
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
        run: |
          if gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "${RELEASE_TAG}" dist/*.whl --repo "${GITHUB_REPOSITORY}" --clobber
          else
            gh release create "${RELEASE_TAG}" dist/*.whl \
              --repo "${GITHUB_REPOSITORY}" \
              --target master \
              --title "JuiceFS ${PACKAGE_VERSION}" \
              --notes "Python SDK wheels for ${PACKAGE_VERSION}."
          fi
